<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="700" viewBox="0 0 2200 700" role="img" aria-labelledby="title desc">
  <title id="title">OncoReady logo</title>
  <desc id="desc">OncoReady wordmark with a rounded-square checkmark icon. No tagline.</desc>

  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFDF9"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C3C34"/>
      <stop offset="55%" stop-color="#155046"/>
      <stop offset="100%" stop-color="#0C3C34"/>
    </linearGradient>

    <linearGradient id="readyPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155046"/>
      <stop offset="100%" stop-color="#0C3C34"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E9A83"/>
      <stop offset="100%" stop-color="#2F7D6A"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5A6560" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(34,105)">
    <rect x="0" y="0" width="455" height="455" rx="92"
          fill="url(#iconBg)" stroke="#DFD8CC" stroke-width="3" filter="url(#shadow)"/>

    <!-- Circular mark with lower-right opening -->
    <path d="M 330 115
             A 145 145 0 1 0 345 330"
          fill="none"
          stroke="url(#purple)"
          stroke-width="42"
          stroke-linecap="round"/>

    <!-- Check mark -->
    <path d="M 136 253 L 205 319 L 309 207"
          fill="none"
          stroke="url(#purple)"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Green status dot -->
    <circle cx="337" cy="112" r="45" fill="url(#green)"/>
    <circle cx="337" cy="112" r="16" fill="#FFFDF9"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif"
     font-weight="800"
     font-size="214"
     letter-spacing="-10">
    <text x="528" y="435" fill="#17211E">Onco</text>
    <text x="1108" y="435" fill="url(#readyPurple)">Ready</text>
  </g>
</svg>
